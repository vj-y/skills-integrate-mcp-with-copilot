name: Add closing comment to issue

on:
  push:
    branches:
      - copilot/add-closing-comment-issue

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add closing comment to issue 5
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ github.repository }}
          issue-number: 5
          body: |
            We implemented the Admin Mode feature by adding a teacher login modal with backend token-based authentication so that only authenticated teachers can register or unregister students from activities, while the participant list remains visible to all users. Thank you to everyone who contributed ideas and feedback on this issue — your input helped shape a clean and practical solution! 🎉
